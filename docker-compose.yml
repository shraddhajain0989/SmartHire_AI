services:
  backend:
    build:
      context: ./backend
    environment:
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - '5000:5000'
    depends_on:
      - mongo
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - '4173:4173'
    depends_on:
      - backend
  mongo:
    image: mongo:6.0
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
    driver: local
